name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Gate ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install package and dev tools
        run: |
          python -m pip install --no-deps -e .
          python -m pip install pytest==9.0.3 pytest-cov==7.1.0 ruff==0.15.17 mypy==2.1.0 bandit==1.9.4 pip-audit==2.10.1
      - name: Gate 1 - static analysis
        run: |
          ruff check gw tests
          mypy gw
          bandit -q -r gw -c pyproject.toml
      - name: Gate 2 - dependency security
        run: |
          python -m pip install --require-hashes --dry-run -r requirements.txt
          pip-audit --strict
      - name: Gate 3 - tests and coverage
        run: pytest --cov=gw --cov-report=term-missing --cov-fail-under=85
      - name: Gate 4 - build verification
        run: |
          ghostwriter --version
          ghostwriter doctor --json
