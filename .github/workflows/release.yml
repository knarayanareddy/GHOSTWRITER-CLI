name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip install build==1.3.0 pytest==9.0.3 pytest-cov==7.1.0 ruff==0.15.17 mypy==2.1.0 bandit==1.9.4 pip-audit==2.10.1 cyclonedx-bom==7.3.0
      - name: Full CI gates
        run: |
          ruff check gw tests
          mypy gw
          bandit -q -r gw -c pyproject.toml
          pip-audit --strict
          pytest --cov=gw --cov-report=term-missing --cov-fail-under=85
          ghostwriter --version
          ghostwriter doctor --json
      - name: Build artifacts
        run: python -m build
      - name: Generate SBOM
        run: cyclonedx-py environment -o dist/sbom.cdx.json
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
